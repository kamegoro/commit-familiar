<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!--
    Fixed rig. Never regenerated by Claude: only scripts/generate.mjs's
    template substitution touches this file's output. The animation is
    bound to these group ids, not to whatever shapes end up inside them,
    so swapping part content never breaks the movement (this is the
    vscode-pets lesson: separate the state/animation layer from the
    swappable art). shape-rendering="crispEdges" keeps pixel-art rects
    looking blocky instead of getting anti-aliased/blurred.

    Character is an original monster, not a human: deliberately avoids
    any need to render faces/skin tones, sidestepping representation
    pitfalls entirely rather than trying to handle them well.

    Idle motion is a steady, rhythmic vertical bounce, reminiscent of a
    turn-based role-playing game's monster battle sprite, described only
    generically here and in every prompt: no specific game, console, or
    franchise is named anywhere in this project, by direct user
    instruction (2026-07-05). An earlier version also had a continuous
    side-to-side rocking motion; removed per the same instruction, since
    the target feel is a steady bounce, not a sway.

    NOTE: XML comments cannot contain two consecutive hyphens anywhere in
    their body: confirmed the hard way when rsvg-convert refused to parse
    this file, reporting a double-hyphen-within-comment error. Use ":" or
    a single hyphen with spaces instead of an em-dash style separator here.
  -->
  <style>
    #character-hop {
      animation: hop 0.9s ease-in-out infinite;
    }
    #eyes-slot {
      animation: blink 4.5s infinite;
      transform-origin: 100px 90px;
    }
    #shoes-slot {
      animation: step 0.9s steps(2) infinite;
      transform-origin: 100px 165px;
    }

    /* Continuous, snappy up-down bounce -- always on, not an occasional
       action. This is the "battle sprite idle" feel the character rig
       exists to produce. */
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92%           { transform: scaleY(0.1); }
    }
    @keyframes step {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }
  </style>

