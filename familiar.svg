<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!--
    Fixed rig. Never regenerated by Claude: only scripts/generate.mjs's
    template substitution touches this file's output. The animation is
    bound to these group ids, not to whatever shapes end up inside them,
    so swapping part content never breaks the movement (this is the
    vscode-pets lesson: separate the state/animation layer from the
    swappable art). shape-rendering="crispEdges" keeps pixel-art rects
    looking blocky instead of getting anti-aliased/blurred.

    Character is an original monster, not a human: deliberately avoids
    any need to render faces/skin tones, sidestepping representation
    pitfalls entirely rather than trying to handle them well.

    Idle motion reworked 2026-07-06 (user feedback: it doesn't need to be
    constantly moving; a handful of varied idle actions repeating
    occasionally reads as more alive than one motion looping constantly).
    Three independently-cycling animations, each mostly at rest with only
    brief action windows, on three cycle lengths (22s / 9s / 17s) with no
    small common multiple, so the moments they each briefly move drift
    in and out of phase with each other over a very long super-cycle
    rather than ever lining up in an obviously repeating pattern, even
    though each individual animation is technically a fixed CSS loop
    (plain CSS in a GitHub-rendered SVG has no source of true randomness).

    NOTE: XML comments cannot contain two consecutive hyphens anywhere in
    their body: confirmed the hard way when rsvg-convert refused to parse
    this file, reporting a double-hyphen-within-comment error. Use ":" or
    a single hyphen with spaces instead of an em-dash style separator here.
  -->
  <style>
    #character-idle {
      animation: idle-bounce 22s ease-in-out infinite;
    }
    #eyes-slot {
      animation: blink 9s infinite;
      transform-origin: 100px 90px;
    }
    #shoes-slot {
      animation: occasional-tap 17s ease-in-out infinite;
      transform-origin: 100px 165px;
    }

    /* At rest almost the whole cycle; two brief, differently-sized
       bounces near 20% and 57% of the way through. */
    @keyframes idle-bounce {
      0%, 18%, 22%, 55%, 59%, 100% { transform: translateY(0); }
      20%                          { transform: translateY(-5px); }
      57%                          { transform: translateY(-7px); }
    }
    /* A single brief blink near the end of each (longer, less frequent
       than the old version) cycle. */
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.1); }
    }
    /* One small tap, independent of the body's bounce timing. */
    @keyframes occasional-tap {
      0%, 40%, 44%, 100% { transform: translateY(0); }
      42%                { transform: translateY(-3px); }
    }
  </style>

